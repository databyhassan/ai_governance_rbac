<div class="container-fluid p-4" style="background: #0f172a; min-height: 100vh; color: #f8fafc; font-family: 'Inter', sans-serif;">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 style="font-weight: 700; color: #38bdf8; margin: 0;">🛡️ AI Governance & Security Intelligence</h2>
      <p style="color: #94a3b8 !important;">Real-time ISO 42001 Risk Scoring, DLP Audits & Anomaly Detection</p>
    </div>
    <button id="refresh-btn" class="btn btn-primary btn-sm" style="background: #0284c7; border: none; border-radius: 8px; padding: 8px 16px;">
      🔄 Refresh Metrics
    </button>
  </div>

  <!-- KPI Cards Row -->
  <div class="row g-3 mb-4">
    <div class="col-md-3">
      <div class="p-3" style="background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;">
        <div style="font-size: 0.85rem; color: #94a3b8;">TOTAL ACCESS REQUESTS</div>
        <div id="kpi-total" style="font-size: 1.8rem; font-weight: 700; color: #f8fafc;">0</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="p-3" style="background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 12px;">
        <div style="font-size: 0.85rem; color: #f87171;">CRITICAL ANOMALIES</div>
        <div id="kpi-critical" style="font-size: 1.8rem; font-weight: 700; color: #ef4444;">0</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="p-3" style="background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 12px;">
        <div style="font-size: 0.85rem; color: #38bdf8;">HIGH RISK RATIO</div>
        <div id="kpi-ratio" style="font-size: 1.8rem; font-weight: 700; color: #38bdf8;">0%</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="p-3" style="background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(168, 85, 247, 0.3); border-radius: 12px;">
        <div style="font-size: 0.85rem; color: #c084fc;">TOTAL AUDIT EVENTS</div>
        <div id="kpi-audit" style="font-size: 1.8rem; font-weight: 700; color: #c084fc;">0</div>
      </div>
    </div>
  </div>

  <!-- Recent Activity Table Section -->
  <div class="p-4" style="background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;">
    <h4 style="font-size: 1.1rem; color: #f8fafc; font-weight: 600;" class="mb-3">Recent Evaluated Access Requests</h4>
    <div class="table-responsive">
      <table class="table align-middle" style="color: #cbd5e1;">
        <thead>
          <tr style="border-bottom: 1px solid rgba(255,255,255,0.1); color: #94a3b8;">
            <th>ID</th>
            <th>APPLICANT</th>
            <th>TARGET ROLE</th>
            <th>DURATION</th>
            <th>ML RISK SCORE</th>
            <th>STATUS</th>
          </tr>
        </thead>
        <tbody id="activity-table-body">
          <!-- Dynamically populated via JS -->
        </tbody>
      </table>
    </div>
  </div>
</div>
